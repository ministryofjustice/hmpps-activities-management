name: Trigger automatic Copilot Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check PR Size
        id: size_check
        run: |
          # Count lines added and deleted (excluding renames/empty lines if needed)
          CHANGES=$(git diff --shortstat "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" | awk '{print $4+$6}')
          echo "Total line changes: $CHANGES"
          
          # Set threshold (e.g., 30 lines)
          if [ "$CHANGES" -gt 30 ]; then
            echo "trigger_review=true" >> $GITHUB_OUTPUT
          else
            echo "trigger_review=false" >> $GITHUB_OUTPUT
          fi

      - name: Request Copilot Review
        if: steps.size_check.outputs.trigger_review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/requested_reviewers \
            -f 'reviewers[]=copilot-pull-request-reviewer[bot]'
