name: Automatic Copilot Review

on:
  workflow_run:
    workflows: ["Copilot Review Trigger"]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  request-review:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}

    steps:
      - name: Check PR size
        id: size_check
        run: |
          CHANGES=$(gh api \
            "repos/${{ github.repository }}/pulls/$PR_NUMBER" \
            --jq '.additions + .deletions')

          echo "Total line changes: $CHANGES"

          if [ "$CHANGES" -gt 30 ]; then
            echo "trigger_review=true" >> "$GITHUB_OUTPUT"
          else
            echo "trigger_review=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Request Copilot Review
        if: steps.size_check.outputs.trigger_review == 'true'
        run: |
          gh api \
            --method POST \
            "repos/${{ github.repository }}/pulls/$PR_NUMBER/requested_reviewers" \
            -f 'reviewers[]=copilot-pull-request-reviewer[bot]'